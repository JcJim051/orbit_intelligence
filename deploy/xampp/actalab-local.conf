# Incluya este archivo desde httpd.conf despues de habilitar mod_proxy_fcgi.
# Para desarrollo local agregue: 127.0.0.1 actalab.local en /etc/hosts.

<VirtualHost *:80>
    ServerName actalab.local
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/actalab/public"

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/actalab/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    LimitRequestBody 524288000

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "logs/actalab-error.log"
    CustomLog "logs/actalab-access.log" combined
</VirtualHost>
