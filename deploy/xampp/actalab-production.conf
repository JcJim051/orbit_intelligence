# Sustituya actas.example.com y las rutas de los certificados antes de usarlo.
# El puerto 443 debe llegar a este equipo desde el router o tunel elegido.

<VirtualHost *:80>
    ServerName actas.example.com
    Redirect permanent / https://actas.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName actas.example.com
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/actalab/public"

    SSLEngine on
    SSLCertificateFile "/ruta/al/fullchain.pem"
    SSLCertificateKeyFile "/ruta/a/privkey.pem"

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/actalab/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    LimitRequestBody 524288000

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "logs/actalab-ssl-error.log"
    CustomLog "logs/actalab-ssl-access.log" combined
</VirtualHost>
